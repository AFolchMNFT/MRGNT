<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — MRGNT admin</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-admin>

<div class="admin-login-wrap">
  <form class="card admin-login-card" id="login-form">
    <h1>MRGNT admin</h1>
    <p class="admin-error" id="login-error" hidden></p>
    <div class="admin-field">
      <label for="username">Usuario</label>
      <input class="admin-input" type="text" id="username" name="username" autocomplete="username" required>
    </div>
    <div class="admin-field">
      <label for="password">Contraseña</label>
      <input class="admin-input" type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-secondary btn-md">Entrar</button>
  </form>
</div>

<script src="/admin/login.js"></script>
</body>
</html>
