<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artistas — MRGNT admin</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
</head>
<body data-admin>

<div class="admin-shell">
  <div class="admin-heading">
    <h1 id="form-heading">NUEVO ARTISTA</h1>
  </div>

  <form class="card admin-form" id="artist-form">
    <input type="hidden" id="artist-id">
    <p class="admin-error" id="artist-error" hidden></p>
    <div class="admin-form-row">
      <div class="admin-field">
        <label for="artist-name">Nombre</label>
        <input class="admin-input" type="text" id="artist-name" required>
      </div>
      <div class="admin-field">
        <label for="artist-discipline">Disciplina</label>
        <select class="admin-select" id="artist-discipline" required></select>
      </div>
    </div>
    <div class="admin-field">
      <label for="artist-genre">Género</label>
      <input class="admin-input" type="text" id="artist-genre">
    </div>
    <div class="admin-field">
      <label for="artist-bio">Biografía (opcional)</label>
      <div class="admin-editor" id="artist-bio-editor"></div>
    </div>
    <div class="admin-field">
      <label for="artist-spotify-search">Buscar en Spotify</label>
      <input class="admin-input" type="text" id="artist-spotify-search" placeholder="Nombre del artista…" autocomplete="off">
      <div class="admin-spotify-results" id="artist-spotify-results" hidden></div>
      <p class="admin-hint">Selecciona un resultado para completar el campo de abajo, o pega un enlace o ID directamente.</p>
    </div>
    <div class="admin-field">
      <label for="artist-spotify">Spotify (ID o URL, opcional)</label>
      <input class="admin-input" type="text" id="artist-spotify" placeholder="https://open.spotify.com/artist/...">
      <p class="admin-hint" id="artist-spotify-status" hidden></p>
      <div class="admin-spotify-preview" id="artist-spotify-preview" hidden>
        <img class="admin-spotify-preview-image" id="artist-spotify-preview-image" alt="">
        <div class="admin-spotify-preview-body">
          <strong id="artist-spotify-preview-name"></strong>
          <ul class="admin-spotify-preview-tracks" id="artist-spotify-preview-tracks"></ul>
        </div>
      </div>
    </div>
    <div class="admin-checkbox-row">
      <input type="checkbox" id="artist-featured">
      <label for="artist-featured">Destacado (Featured)</label>
    </div>
    <div class="admin-checkbox-row">
      <input type="checkbox" id="artist-show-spotify">
      <label for="artist-show-spotify">Mostrar reproductor de Spotify</label>
    </div>
    <div class="admin-form-actions">
      <button type="submit" class="btn btn-secondary btn-md" id="artist-submit">Guardar artista</button>
      <button type="button" class="btn btn-secondary btn-md" id="artist-preview">Vista previa</button>
      <button type="button" class="admin-btn-link" id="artist-cancel" hidden>Cancelar edición</button>
    </div>
  </form>

  <div class="admin-list" id="artists-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script type="module" src="/admin/artists.js"></script>
</body>
</html>
