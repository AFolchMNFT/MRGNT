<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventos — MRGNT admin</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
</head>
<body data-admin>

<div class="admin-shell">
  <div class="admin-heading">
    <h1 id="form-heading">NUEVO EVENTO</h1>
  </div>

  <form class="card admin-form" id="event-form">
    <input type="hidden" id="event-id">
    <p class="admin-error" id="event-error" hidden></p>
    <div class="admin-form-row">
      <div class="admin-field">
        <label for="event-date">Fecha</label>
        <input class="admin-input" type="date" id="event-date" required>
      </div>
      <div class="admin-field">
        <label for="event-time">Hora</label>
        <input class="admin-input" type="text" id="event-time" placeholder="8:00 PM" required>
      </div>
    </div>
    <div class="admin-form-row">
      <div class="admin-field">
        <label for="event-stage">Lugar</label>
        <input class="admin-input" type="text" id="event-stage" placeholder="Nombre del lugar, foro o escenario" required>
      </div>
      <div class="admin-field">
        <label for="event-artist">Artista / acto</label>
        <input class="admin-input" type="text" id="event-artist" required>
      </div>
    </div>
    <div class="admin-field">
      <label for="event-location-url">Ubicación en Google Maps (opcional)</label>
      <input class="admin-input" type="url" id="event-location-url" placeholder="https://maps.app.goo.gl/...">
      <p class="admin-hint">En Google Maps, busca el lugar exacto y usa "Compartir" → "Copiar enlace". Se mostrará como mapa en la página del evento.</p>
    </div>
    <div class="admin-field">
      <label for="event-title">Título (opcional)</label>
      <input class="admin-input" type="text" id="event-title" placeholder="Solo si el evento necesita un título distinto al artista/acto">
    </div>
    <div class="admin-field">
      <label for="event-tag">Etiqueta (opcional)</label>
      <input class="admin-input" type="text" id="event-tag" placeholder="Headliner, Destacado, etc.">
    </div>
    <div class="admin-field">
      <label for="event-description">Descripción (opcional)</label>
      <div class="admin-editor" id="event-description-editor"></div>
    </div>
    <div class="admin-form-row">
      <div class="admin-field">
        <label for="event-cost">Costo (opcional)</label>
        <input class="admin-input" type="text" id="event-cost" placeholder="Gratis, $200 MXN, etc.">
      </div>
      <div class="admin-field">
        <label for="event-ticket-link">Enlace de boletos (opcional)</label>
        <input class="admin-input" type="url" id="event-ticket-link" placeholder="https://...">
      </div>
    </div>
    <div class="admin-field">
      <label for="event-embed-url">Embed de redes sociales (opcional)</label>
      <input class="admin-input" type="url" id="event-embed-url" placeholder="https://www.youtube.com/watch?v=...">
      <p class="admin-hint">Pega un enlace de YouTube, Instagram, TikTok o X/Twitter para mostrarlo en la página del evento.</p>
    </div>
    <div class="admin-form-actions">
      <button type="submit" class="btn btn-secondary btn-md" id="event-submit">Guardar evento</button>
      <button type="button" class="admin-btn-link" id="event-cancel" hidden>Cancelar edición</button>
    </div>
  </form>

  <div class="admin-list" id="events-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script type="module" src="/admin/events.js"></script>
</body>
</html>
