<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRGNT admin</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-admin>

<div class="admin-shell">
  <div class="admin-heading">
    <h1>PANEL DE ADMINISTRACIÓN</h1>
  </div>
  <div class="admin-list" id="dashboard-list"></div>
</div>

<script type="module">
  import { requireAdminSession, renderAdminNav } from '/admin/admin-common.js';

  const CARDS = [
    { href: '/admin/artists.html', title: 'Artistas', sub: 'Agregar, editar o eliminar artistas del lineup.', roles: ['admin'] },
    { href: '/admin/events.html', title: 'Eventos', sub: 'Agregar, editar o eliminar fechas de la cartelera.', roles: ['admin'] },
    { href: '/admin/event-submissions.html', title: 'Solicitudes de eventos', sub: 'Revisar y aprobar eventos enviados por la comunidad.', roles: ['admin'] },
    { href: '/admin/articles.html', title: 'Noticias', sub: 'Agregar, editar o eliminar artículos de noticias.', roles: ['admin', 'writer'] },
    { href: '/admin/users.html', title: 'Usuarios', sub: 'Crear y administrar cuentas de administradores y redactores.', roles: ['admin'] },
  ];

  requireAdminSession().then((session) => {
    if (!session) return;
    renderAdminNav(null, session.role);
    const list = document.getElementById('dashboard-list');
    list.innerHTML = CARDS.filter((c) => c.roles.includes(session.role)).map((c) => `
      <a class="card admin-row" href="${c.href}" style="text-decoration:none;">
        <div class="admin-row-main">
          <div class="admin-row-title">${c.title}</div>
          <div class="admin-row-sub">${c.sub}</div>
        </div>
      </a>
    `).join('');
  });
</script>
</body>
</html>
