<!-- HEADER -->
<section class="page-header">
  <a href="artistas.html" class="noticia-back">← Volver a artistas</a>
  <h1>PROPÓN UN ARTISTA</h1>
  <p>¿Conoces a un artista emergente que debería estar en MRGNT? Cuéntanos de él o ella y lo revisaremos antes de publicarlo.</p>
</section>

<!-- FORM -->
<section class="page-content">
  <div class="card submit-card">
    <form id="artist-submit-form" class="submit-form">
      <p class="submit-message" id="artist-submit-error" hidden></p>
      <p class="submit-message submit-message-success" id="artist-submit-success" hidden></p>

      <input type="text" id="artist-website" name="website" class="submit-honeypot" tabindex="-1" autocomplete="off">

      <div class="submit-row">
        <div class="submit-field">
          <label for="artist-name">Nombre del artista</label>
          <input class="submit-input" type="text" id="artist-name" required>
        </div>
        <div class="submit-field">
          <label for="artist-discipline">Disciplina</label>
          <select class="submit-input" id="artist-discipline" required></select>
        </div>
      </div>
      <div class="submit-field">
        <label for="artist-genre">Género (opcional)</label>
        <input class="submit-input" type="text" id="artist-genre" placeholder="Rap, óleo, spoken word, etc.">
      </div>
      <div class="submit-field">
        <label for="artist-bio">Biografía (opcional)</label>
        <textarea class="submit-input submit-textarea" id="artist-bio"></textarea>
      </div>
      <div class="submit-field">
        <label for="artist-spotify">Spotify (enlace, opcional)</label>
        <input class="submit-input" type="text" id="artist-spotify" placeholder="https://open.spotify.com/artist/...">
        <p class="submit-hint" id="artist-spotify-status" hidden></p>
        <div class="submit-spotify-preview" id="artist-spotify-preview" hidden>
          <img class="submit-spotify-preview-image" id="artist-spotify-preview-image" alt="">
          <div class="submit-spotify-preview-body">
            <strong id="artist-spotify-preview-name"></strong>
            <ul class="submit-spotify-preview-tracks" id="artist-spotify-preview-tracks"></ul>
          </div>
        </div>
      </div>

      <hr class="submit-divider">

      <div class="submit-row">
        <div class="submit-field">
          <label for="artist-submitter-name">Tu nombre</label>
          <input class="submit-input" type="text" id="artist-submitter-name" required>
        </div>
        <div class="submit-field">
          <label for="artist-submitter-email">Tu email</label>
          <input class="submit-input" type="email" id="artist-submitter-email" placeholder="Para contactarte si tenemos dudas" required>
        </div>
      </div>

      <button type="submit" class="btn btn-secondary btn-md" id="artist-submit-btn">Enviar artista</button>
    </form>
  </div>
</section>
